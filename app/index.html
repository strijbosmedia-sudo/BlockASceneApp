<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0B0C0F" />
  <title>Block4Film · Film Blocking Studio</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="startupSplash" class="startup-splash" role="status" aria-label="Launching Block4Film"><span>Block4Film</span></div>
  <div id="app"></div>
  <input type="file" id="backgroundFile" hidden accept="image/png,image/jpeg,image/webp,image/svg+xml" />
  <input type="file" id="projectFile" hidden accept=".blockascene,.json,application/json" />
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./model.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
