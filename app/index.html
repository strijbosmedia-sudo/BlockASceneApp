<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0B0C0F" />
  <title>Block4Film · Film Blocking Studio</title>
  <link rel="icon" href="./assets/Block4Film-Icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="startupSplash" class="startup-splash" role="status" aria-label="Launching Block4Film"><div class="startup-brand"><img class="startup-icon" src="./assets/Block4Film-Icon.svg" alt="" aria-hidden="true" /><img class="startup-wordmark" src="./assets/Block4Film-Wordmark.svg" alt="Block4Film" /></div></div>
  <div id="app"></div>
  <input type="file" id="backgroundFile" hidden accept="image/png,image/jpeg,image/webp,image/svg+xml" />
  <input type="file" id="projectFile" hidden accept=".blockascene,.json,application/json" />
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./model.js" defer></script>
  <script src="./playback.js" defer></script>
  <script src="./manual.js" defer></script>
  <script src="./native-export.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
