name: Build signed Android release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Validate release credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT; do
            if [ -z "${!name}" ]; then echo "::error::Missing Android release signing secret: $name"; exit 1; fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate editor and prepare Android
        run: |
          npm run test:model
          npm run mobile:android
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/block4film-release.jks"
      - name: Build release APK with persistent signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/block4film-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Verify signature, application identity and version
        env:
          EXPECTED_CERT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then echo "::error::APK signing certificate does not match the approved certificate"; exit 1; fi
          version="$(node -p "require('./package.json').version")"
          code="$(node -p "require('./scripts/configure-android.cjs').versionCode(require('./package.json').version)")"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -F "package: name='media.strijbos.block4film' versionCode='$code' versionName='$version'" "$RUNNER_TEMP/package.txt"
          if "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'; then echo "::error::Release APK is debuggable"; exit 1; fi
          mkdir -p android-release-out
          cp "$apk" "android-release-out/Block4Film-$version-Android.apk"
          cp "$RUNNER_TEMP/signature.txt" android-release-out/signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Block4Film-Android-Signed-Release-Candidate
          path: android-release-out/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/block4film-release.jks"
