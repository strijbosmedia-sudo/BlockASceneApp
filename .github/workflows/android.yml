name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu runners include Android SDK tooling; setup-android@v3 incorrectly
      # requests the obsolete 'tools' SDK package on current runner images.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test core editor
        run: npm run test:model
      - name: Generate Android app
        run: npm run android:prepare
      - name: Build debug-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Copy APK for download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Block4Film-Android-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Block4Film-Android-APK
          path: Block4Film-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
