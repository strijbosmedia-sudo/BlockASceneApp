name: Publish Block4Film Windows portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'desktop/**'
      - 'package.json'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate editor
        run: npm run test:model
      - name: Build portable Windows EXE
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets
      - name: Publish Windows release and retire cross-platform beta
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_TAG: v1.2.1-polish-beta.1
        run: |
          set -euo pipefail
          ls -lh release-assets/*.exe
          if gh release view "$WINDOWS_TAG" > /dev/null 2>&1; then
            gh release upload "$WINDOWS_TAG" release-assets/*.exe --clobber
          else
            gh release create "$WINDOWS_TAG" release-assets/*.exe \
              --target "$GITHUB_SHA" \
              --title "Block4Film 1.2.1 - Visual Polish Beta" \
              --notes "Windows-only Block4Film v1.2.1 polish beta. Fixes pinned Properties rail selection, responsive Workspace grid layout, automatic first-free actor letters/camera numbers and editable collision-safe scene identities, and adds top-bar Back to Scenes. Existing v1.2.0 and all older releases remain available. Export a .blockascene backup before testing." \
              --prerelease
          fi
          gh release view "$WINDOWS_TAG" --json assets --jq '.assets[].name' | grep -qE '\.exe$'
