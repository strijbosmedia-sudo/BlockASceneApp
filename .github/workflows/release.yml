name: Publish Block4Film Windows portable release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'app/**'
      - 'desktop/**'
      - 'package.json'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate editor
        run: npm run test:model
      - name: Build portable Windows EXE (sign only with trusted certificate)
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode when signing was requested
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Code signing failed: $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
        env:
          SIGN_WINDOWS: ${{ secrets.WIN_CSC_LINK != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error
  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets
      - name: Publish Windows release and retire cross-platform beta
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_TAG: v1.3.1-tablet-motion-beta.1
        run: |
          set -euo pipefail
          ls -lh release-assets/*.exe
          if gh release view "$WINDOWS_TAG" > /dev/null 2>&1; then
            gh release upload "$WINDOWS_TAG" release-assets/*.exe --clobber
          else
            gh release create "$WINDOWS_TAG" release-assets/*.exe \
              --target "$GITHUB_SHA" \
              --title "Block4Film 1.3.1 - Tablet Motion & Keyframes Beta" \
              --notes "Block4Film 1.3.1 tablet movement beta: touch tap-to-select and brief hold-to-move, stable move destinations, actor turn and camera pan within beats, editable curved motion keyframes, final destination facing control, and next-beat inheritance of end poses. Windows and Android testing encouraged. Existing stable v1.3.0 remains available. Back up your .blockascene files before testing." \
              --prerelease
          fi
          gh release view "$WINDOWS_TAG" --json assets --jq '.assets[].name' | grep -qE '\.exe$'
