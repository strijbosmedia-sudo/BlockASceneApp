name: Publish Block4Film Windows portable release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after Windows acceptance testing'
        type: boolean
        default: false
      stable:
        description: 'Mark accepted build as stable (otherwise prerelease)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      SIGN_WINDOWS: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate editor
        run: npm run test:model
      - name: Build portable Windows EXE (sign only with trusted certificate)
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Authenticode when signing was requested
        if: ${{ env.SIGN_WINDOWS == 'true' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $exe.FullName
          if ($signature.Status -ne 'Valid') { throw "Code signing failed: $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*.exe
          if-no-files-found: error
  publish:
    needs: windows
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets
      - name: Publish accepted Windows build without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_TAG: v1.4.1
          STABLE_RELEASE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          if [ "$STABLE_RELEASE" != "true" ]; then WINDOWS_TAG="$WINDOWS_TAG-rc.1"; fi
          ls -lh release-assets/*.exe
          if gh release view "$WINDOWS_TAG" > /dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace published downloads"
            exit 1
          else
            flags=()
            if [ "$STABLE_RELEASE" != "true" ]; then flags+=(--prerelease); fi
            gh release create "$WINDOWS_TAG" release-assets/*.exe "${flags[@]}" \
              --target "$GITHUB_SHA" \
              --title "Block4Film 1.4.1 - Scene Planning Release" \
              --notes "Block4Film 1.4.1: preserve imported floor-plan aspect ratios with adjustable scale, wall/window menu, direct resize handles for furniture/walls/windows/doors, adjustable lens-constrained camera cone reach, modular lights with Standard/Softbox/Spotlight and Kelvin/Color modes, and cropped Block4Film Android launcher icon. Windows release; Android APK remains test-signed until a persistent signing key is configured. Existing stable 1.3.0 remains available."
          fi
          gh release view "$WINDOWS_TAG" --json assets --jq '.assets[].name' | grep -qE '\.exe$'
